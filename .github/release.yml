changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - octocat
  categories:
    - title: '📱 Mobile App'
      labels:
        - app
        - mobile
        - android
        - mesh
      # If no labels match, it will look at the title/body for these keywords
    - title: '🌐 Website & Platform'
      labels:
        - website
        - web
        - ui
        - docs
    - title: '🚀 New Features'
      labels:
        - enhancement
        - feature
      patterns:
        - 'feat:.*'
        - 'feature:.*'
    - title: '🐛 Bug Fixes'
      labels:
        - bug
        - fix
      patterns:
        - 'fix:.*'
        - 'bug:.*'
    - title: '🔧 Maintenance'
      labels:
        - chore
        - dependencies
      patterns:
        - 'chore:.*'
        - 'docs:.*'
        - 'style:.*'
        - 'refactor:.*'
        - 'perf:.*'
        - 'test:.*'
