# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PeerChat CI/CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=key" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configuration: ".github/release.yml"

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PeerChat-$VERSION.apk

          # Create release using the generated changelog
          cat << 'EOF' > release_notes.md
          ${{ steps.build_changelog.outputs.changelog }}
          EOF

          gh release create $VERSION \
            --repo $GITHUB_REPOSITORY \
            --title "PeerChat $VERSION" \
            --notes-file release_notes.md \
            build/app/outputs/flutter-apk/PeerChat-$VERSION.apk
